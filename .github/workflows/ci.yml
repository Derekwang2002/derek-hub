name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Share Board tests
        run: npm run test:board

      - name: Project tests
        run: npm run test:projects

      - name: Table of contents tests
        run: npm run test:toc

      - name: Article benchmark tests
        run: npm run test:benchmark

      - name: Notes routing tests
        run: npm run test:notes

      - name: Search tests
        run: npm run test:search

      - name: Build
        run: npm run build
