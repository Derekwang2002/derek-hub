<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Avatar uploads: files and application records</title><desc id="desc">The browser requests authorization from the Avatar API and uploads directly to OSS. The API validates the content, writes a final object, and updates the user record in PostgreSQL.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#516856"/></marker></defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #25352b; }
.title { font-size: 28px; font-weight: 650; }
.name { font-size: 25px; font-weight: 650; }
.sub { font-size: 18px; fill: #5e6a62; }
.label { font-size: 20px; font-weight: 500; paint-order: stroke; stroke: #f7f8f4; stroke-width: 10px; stroke-linejoin: round; }
.note { font-size: 20px; font-weight: 600; }
.box { fill: #fff; stroke: #b6c3b8; stroke-width: 1.5; }
.arrow { fill: none; stroke: #516856; stroke-width: 2.5; marker-end: url(#arrow); }
</style>
<rect width="960" height="700" rx="20" fill="#f7f8f4"/>
<text x="40" y="55" class="title" text-anchor="start">Avatar uploads: files and application records</text>
<path d="M320 150 H640" class="arrow"/>
<path d="M640 210 H320" class="arrow"/>
<path d="M180 265 V455" class="arrow"/>
<path d="M780 265 V455" class="arrow"/>
<path d="M680 265 L280 455" class="arrow"/>
<rect x="40" y="130" width="280" height="110" rx="16" class="box"/><text x="180" y="175" class="name" text-anchor="middle">Browser</text><text x="180" y="208" class="sub" text-anchor="middle">Authenticated user</text>
<rect x="640" y="130" width="280" height="110" rx="16" class="box"/><text x="780" y="175" class="name" text-anchor="middle">Avatar API</text><text x="780" y="208" class="sub" text-anchor="middle">Identity, signing, validation</text>
<rect x="40" y="465" width="280" height="110" rx="16" class="box"/><text x="180" y="510" class="name" text-anchor="middle">Alibaba Cloud OSS</text><text x="180" y="543" class="sub" text-anchor="middle">Staging → final object</text>
<rect x="640" y="465" width="280" height="110" rx="16" class="box"/><text x="780" y="510" class="name" text-anchor="middle">PostgreSQL</text><text x="780" y="543" class="sub" text-anchor="middle">Upload tasks, avatar references</text>
<text x="480" y="131" class="label" text-anchor="middle">1. Request / confirm upload</text>
<text x="480" y="194" class="label" text-anchor="middle">2. Temporary upload URL</text>
<text x="180" y="356" class="label" text-anchor="middle">3. Direct upload</text>
<text x="780" y="356" class="label" text-anchor="middle">5. Update record</text>
<text x="480" y="330" class="label" text-anchor="middle">4. Read and validate</text>
<text x="480" y="382" class="label" text-anchor="middle">Write validated bytes</text>
<rect x="40" y="610" width="880" height="1" fill="#d8dfd6"/>
<text x="40" y="644" class="note" text-anchor="start">Example · pending → validation → final object → ready</text>
<text x="40" y="674" class="sub" text-anchor="start">The browser cannot write the final key. Completion supports retries.</text>
</svg>
