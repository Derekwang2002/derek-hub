<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img" aria-labelledby="title desc" lang="zh">
<title id="title">头像上传：文件与业务记录分开保存</title><desc id="desc">浏览器先向头像 API 申请授权，再直接上传 OSS。API 验证上传内容、写入正式对象，最后在 PostgreSQL 更新用户头像。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#516856"/></marker></defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #25352b; }
.title { font-size: 28px; font-weight: 650; }
.name { font-size: 25px; font-weight: 650; }
.sub { font-size: 18px; fill: #5e6a62; }
.label { font-size: 20px; font-weight: 500; paint-order: stroke; stroke: #f7f8f4; stroke-width: 10px; stroke-linejoin: round; }
.note { font-size: 20px; font-weight: 600; }
.box { fill: #fff; stroke: #b6c3b8; stroke-width: 1.5; }
.arrow { fill: none; stroke: #516856; stroke-width: 2.5; marker-end: url(#arrow); }
</style>
<rect width="960" height="700" rx="20" fill="#f7f8f4"/>
<text x="40" y="55" class="title" text-anchor="start">头像上传：文件与业务记录分开保存</text>
<path d="M320 150 H640" class="arrow"/>
<path d="M640 210 H320" class="arrow"/>
<path d="M180 265 V455" class="arrow"/>
<path d="M780 265 V455" class="arrow"/>
<path d="M680 265 L280 455" class="arrow"/>
<rect x="40" y="130" width="280" height="110" rx="16" class="box"/><text x="180" y="175" class="name" text-anchor="middle">浏览器</text><text x="180" y="208" class="sub" text-anchor="middle">已登录用户</text>
<rect x="640" y="130" width="280" height="110" rx="16" class="box"/><text x="780" y="175" class="name" text-anchor="middle">头像 API</text><text x="780" y="208" class="sub" text-anchor="middle">身份、授权、内容校验</text>
<rect x="40" y="465" width="280" height="110" rx="16" class="box"/><text x="180" y="510" class="name" text-anchor="middle">阿里云 OSS</text><text x="180" y="543" class="sub" text-anchor="middle">暂存对象 → 正式对象</text>
<rect x="640" y="465" width="280" height="110" rx="16" class="box"/><text x="780" y="510" class="name" text-anchor="middle">PostgreSQL</text><text x="780" y="543" class="sub" text-anchor="middle">上传任务、用户头像引用</text>
<text x="480" y="131" class="label" text-anchor="middle">1. 申请上传 / 完成通知</text>
<text x="480" y="194" class="label" text-anchor="middle">2. 临时上传 URL</text>
<text x="180" y="356" class="label" text-anchor="middle">3. 文件直传</text>
<text x="780" y="356" class="label" text-anchor="middle">5. 更新记录</text>
<text x="480" y="330" class="label" text-anchor="middle">4. 读取并校验</text>
<text x="480" y="382" class="label" text-anchor="middle">写入验证后的字节</text>
<rect x="40" y="610" width="880" height="1" fill="#d8dfd6"/>
<text x="40" y="644" class="note" text-anchor="start">示例架构 · pending → 校验 → 正式对象 → ready</text>
<text x="40" y="674" class="sub" text-anchor="start">正式 Key 不向浏览器授予写权限。完成请求需要支持重试。</text>
</svg>
